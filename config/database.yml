default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>

test:
  <<: *default
  # NEVER fall back to DATABASE_URL here — it could be prod
  url: <%= ENV['DATABASE_URL_TEST'] %>

production:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>
